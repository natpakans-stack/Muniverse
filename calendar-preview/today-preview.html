<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyMu — App Preview (Tab Navigation)</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/line-seed-sans-th" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* LINE Seed Sans TH loaded via Google Fonts fallback (Noto Sans Thai) */
    body { margin: 0; padding: 0; overflow-x: hidden; }
    * { box-sizing: border-box; }
    input, button, textarea, select {
      font-family: "LINE Seed Sans TH", "Noto Sans Thai", -apple-system, sans-serif !important;
    }
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      10%, 30%, 50%, 70%, 90% { transform: rotate(-8deg); }
      20%, 40%, 60%, 80% { transform: rotate(8deg); }
    }
    @keyframes flipCard {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(90deg); }
      100% { transform: rotateY(0deg); }
    }
    @keyframes starSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ═══════════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════════ */
    const T = {
      primary: '#EC599D',
      primaryLight: '#FDEFF5',
      primaryMid: '#F7BDD8',
      secondary: '#7279FB',
      secondaryLight: '#F1F2FF',
      secondaryMid: '#C7C9FD',
      success: '#559652',
      successLight: '#E1F2E0',
      successBg: '#F0F8F0',
      warning: '#F8C135',
      warningLight: '#FEF3D7',
      warningBg: '#FEF9EB',
      error: '#EA244F',
      errorLight: '#FBD3DC',
      errorBg: '#FDE9ED',
      fgHigh: '#1B1D22',
      fgMid: '#6A6E83',
      fgLow: '#9A9DAD',
      bgWhite: '#FFFFFF',
      bgLight: '#F8F8F9',
      bgMid: '#EBECEF',
      bgDark: '#CFD1D9',
      border: '#EBECEF',
      rSm: '4px', rMd: '8px', rLg: '12px', rXl: '16px', r2xl: '24px', rFull: '9999px',
      font: '"LINE Seed Sans TH", "Noto Sans Thai", -apple-system, sans-serif',
    };

    /* ═══════════════════════════════════════════
       MOCK DATA
    ═══════════════════════════════════════════ */
    const mock = {
      date: '17 กุมภาพันธ์ 2569',
      dayName: 'วันอังคาร',
      status: 'good',
      statusLabel: 'วันนี้ดวงดี',
      statusIcon: '⭐',
      aiSummary: 'วันนี้ดาวพฤหัสส่องสว่าง เรื่องการเงินมีโชค แต่ระวังการตัดสินใจเรื่องความรัก อย่าใจร้อน',
      luckyColors: [
        { aspect: 'งาน',    c1: '#E85D3A', c2: '#F5A623', name: 'ส้ม-แดง' },
        { aspect: 'เงิน',   c1: '#F5C842', c2: '#E8B730', name: 'ทอง' },
        { aspect: 'โชค',    c1: '#C8C8C8', c2: '#EFEFEF', name: 'เทา' },
        { aspect: 'รัก',    c1: '#F8A4C8', c2: '#FADCE8', name: 'ชมพู' },
        { aspect: 'โชคร้าย', c1: '#9B59B6', c2: '#D2B4DE', name: 'ม่วง' },
      ],
      doList: ['เหมาะกับการเริ่มต้นสิ่งใหม่', 'ลงทุนระยะสั้นจะได้ผลดี'],
      avoidList: ['หลีกเลี่ยงการเซ็นสัญญา', 'อย่าใจร้อนเรื่องความรัก'],
      luckyNumbers: [9, 14, 23],
      times: [
        { time: '06:00-09:00', label: 'ดีมาก', level: 'good' },
        { time: '09:00-12:00', label: 'ปกติ', level: 'neutral' },
        { time: '12:00-14:00', label: 'ระวัง', level: 'caution' },
        { time: '14:00-18:00', label: 'ดี', level: 'good' },
        { time: '18:00-21:00', label: 'ดีมาก', level: 'good' },
        { time: '21:00-00:00', label: 'ปกติ', level: 'neutral' },
      ],
      natal: 'ดาวอาทิตย์อยู่ราศีกุมภ์ ดาวจันทร์อยู่ราศีพฤษภ',
      transit: 'ดาวพฤหัสจรผ่านราศีเมถุน ส่งพลังด้านการเงิน',
      aiSuggestion: 'วันนี้ดาวพฤหัสส่งพลังการเงิน ลองซื้อหวยหรือเริ่มลงทุนใหม่ ดวงความรักดี ชวนคนพิเศษไปทานข้าว',
    };

    const genCalData = (y, m) => {
      const days = new Date(y, m + 1, 0).getDate();
      const d = {}; const now = new Date();
      for (let i = 1; i <= days; i++) {
        const r = Math.sin(y * 100 + m * 31 + i * 7) * 0.5 + 0.5;
        d[i] = r < 0.35 ? 'good' : r < 0.7 ? 'neutral' : 'caution';
      }
      if (now.getFullYear() === y && now.getMonth() === m) d[now.getDate()] = 'good';
      return d;
    };

    const engines = [
      { id: 'siamsi', name: 'เซียมซีวันนี้', sub: 'สุ่มเซียมซี ได้คำทำนายประจำวัน', icon: '🎋', badge: 'ยอดนิยม' },
      { id: 'tarot', name: 'เปิดไพ่ทำนาย', sub: 'เปิดไพ่ 3 ใบ รู้ดวงวันนี้', icon: '🃏', badge: null },
      { id: 'dream', name: 'ทำนายฝัน', sub: 'เล่าฝัน แปลความหมาย', icon: '💭', badge: 'ใหม่' },
    ];

    const MO = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    const DH = ['อา','จ','อ','พ','พฤ','ศ','ส'];
    const DF = ['วันอาทิตย์','วันจันทร์','วันอังคาร','วันพุธ','วันพฤหัสบดี','วันศุกร์','วันเสาร์'];

    /* Special days per month (keyed by month 0-11, then day) */
    const specialDayTypes = {
      phra:    { fa: 'fa-solid fa-hands-praying',    label: 'วันพระ',      color: '#FF9500' },
      chinese: { fa: 'fa-solid fa-yin-yang',         label: 'วันพระจีน',   color: '#E53935' },
      lucky:   { fa: 'fa-solid fa-star',             label: 'วันธงไชย',    color: '#FFD700' },
      kalakin: { fa: 'fa-solid fa-skull',            label: 'วันกาลกิณี',  color: '#78909C' },
      worship: { fa: 'fa-solid fa-place-of-worship', label: 'วันไหว้เจ้า',  color: '#AB47BC' },
      holiday: { fa: 'fa-solid fa-umbrella-beach',   label: 'วันหยุด',     color: '#EA244F' },
    };
    const FaIcon = ({ fa, size = 12, color = T.fgMid, style: s }) => React.createElement('i', { className: fa, style: { fontSize: `${size}px`, color, ...s } });
    const genSpecialDays = (y, m) => {
      const map = {};
      const dim = new Date(y, m + 1, 0).getDate();
      /* Seed-based pseudo-random assignment per month */
      for (let d = 1; d <= dim; d++) {
        const r = Math.abs(Math.sin(y * 73 + m * 37 + d * 13));
        const items = [];
        if (d % 8 === 1 || d % 8 === 0)          items.push('phra');
        if (d === 1 || d === 15 || d === 16)       items.push('chinese');
        if (r < 0.2)                                items.push('lucky');
        if (d === 7 || d === 21)                    items.push('kalakin');
        if (d === 2 || d === 9 || d === 24)         items.push('worship');
        if (m === 0 && d === 1)                     items.push('holiday');
        if (m === 1 && d === 14)                    items.push('holiday');
        if (m === 3 && (d === 13||d === 14||d === 15)) items.push('holiday');
        if (m === 4 && d === 1)                     items.push('holiday');
        if (m === 11 && (d === 5||d === 10||d === 31)) items.push('holiday');
        if (items.length) map[d] = items;
      }
      return map;
    };

    /* ═══════════════════════════════════════════
       HELPERS
    ═══════════════════════════════════════════ */
    const sColor = s => s === 'good' ? T.success : s === 'neutral' ? T.warning : T.error;
    const sBg = s => s === 'good' ? T.successBg : s === 'neutral' ? T.warningBg : T.errorBg;
    const sLabel = s => s === 'good' ? 'ดวงดี' : s === 'neutral' ? 'ปกติ' : 'ระวัง';
    const sIcon = s => s === 'good' ? '⭐' : s === 'neutral' ? '🌤️' : '⚠️';

    /* Dual-color overlapping circles (Mastercard-style) */
    const DualColor = ({ c1, c2, size = 32 }) => {
      const r = size / 2;
      const overlap = size * 0.3;
      return (
        <div style={{ position:'relative', width: size + size - overlap, height: size }}>
          <div style={{ position:'absolute', left:0, top:0, width:size, height:size, borderRadius:'50%', background:c1, border:'2px solid #fff', zIndex:1 }} />
          <div style={{ position:'absolute', left:size - overlap, top:0, width:size, height:size, borderRadius:'50%', background:c2, border:'2px solid #fff' }} />
        </div>
      );
    };

    /* ═══════════════════════════════════════════
       MAIN APP
    ═══════════════════════════════════════════ */
    const App = () => {
      const [screen, setScreen] = useState('today');
      const [selDay, setSelDay] = useState(null);
      const [cM, setCM] = useState(new Date().getMonth());
      const [cY, setCY] = useState(new Date().getFullYear());
      const [calData, setCalData] = useState({});
      const [calSub, setCalSub] = useState('month');
      const now = new Date();

      useEffect(() => { setCalData(genCalData(cY, cM)); }, [cM, cY]);

      const go = (s, day) => {
        if (day) setSelDay(day);
        if (s === 'daydetail') { setCalSub('day'); setScreen('calendar'); return; }
        if (s === 'yearview')  { setCalSub('year'); setScreen('calendar'); return; }
        if (s === 'fullcal')   { setCalSub('month'); setScreen('calendar'); return; }
        setScreen(s);
      };
      const prevMonth = () => { if (cM === 0) { setCM(11); setCY(y => y - 1); } else setCM(m => m - 1); };
      const nextMonth = () => { if (cM === 11) { setCM(0); setCY(y => y + 1); } else setCM(m => m + 1); };

      /* ─── Screen Groups for Navigator ─── */
      const groups = [
        { label: 'TODAY', items: [
          { id: 'today', name: 'ดวงวันนี้' },
        ]},
        { label: 'CALENDAR', items: [
          { id: 'calendar', name: 'ปฏิทิน (3 sub-tabs)' },
        ]},
        { label: 'NOTIFICATIONS', items: [
          { id: 'notify', name: 'แจ้งเตือน' },
        ]},
        { label: 'FORTUNE', items: [
          { id: 'fortune', name: 'ทำนาย (Hub)' },
          { id: 'siamsi', name: 'เซียมซี' },
          { id: 'tarot', name: 'เปิดไพ่' },
          { id: 'dream', name: 'ทำนายฝัน' },
        ]},
        { label: 'PROFILE', items: [
          { id: 'profile', name: 'โปรไฟล์' },
        ]},
        { label: 'STATES', items: [
          { id: 'loading', name: 'Loading (Skeleton)' },
          { id: 'empty', name: 'Empty State' },
          { id: 'error', name: 'Error State' },
          { id: 'share', name: 'Share Card' },
        ]},
      ];

      /* ─── Shared Components ─── */
      const DynamicIsland = () => (
        <div style={{ display: 'flex', justifyContent: 'center', paddingTop: '10px' }}>
          <div style={{ width: '126px', height: '36px', background: '#000', borderRadius: '20px' }} />
        </div>
      );

      const StatusBar = () => (
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 24px 0', height: '44px' }}>
          <span style={{ fontFamily: T.font, fontSize: '15px', fontWeight: 600, color: T.fgHigh }}>9:41</span>
          <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
            <svg width="17" height="12" viewBox="0 0 17 12"><path d="M1 4.5C3.5.8 7.2-0.3 8.5 0.2c1.3.5 2.8 1.8 4.2 4" stroke="#1B1D22" fill="none" strokeWidth="1.5"/><path d="M3 6.8c1.5-2 3.5-2.8 5.5-1.8s3 2.5 3.5 3.5" stroke="#1B1D22" fill="none" strokeWidth="1.5"/><circle cx="8.5" cy="10" r="1.5" fill="#1B1D22"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="0" width="3" height="12" rx="1" fill="#1B1D22" opacity="0.3"/><rect x="4.5" y="3" width="3" height="9" rx="1" fill="#1B1D22" opacity="0.3"/><rect x="9" y="1" width="3" height="11" rx="1" fill="#1B1D22"/><rect x="13" y="0" width="3" height="12" rx="1" fill="#1B1D22"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2.5" stroke="#1B1D22" strokeWidth="1" fill="none"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="#1B1D22" opacity="0.4"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.5" fill="#559652"/></svg>
          </div>
        </div>
      );

      const TabBar = ({ active = 'today' }) => {
        const tabs = [
          { id:'calendar', fa:'fa-solid fa-calendar-days', l:'ปฏิทิน' },
          { id:'notify',   fa:'fa-solid fa-bell',          l:'แจ้งเตือน' },
          { id:'today',    fa:'fa-solid fa-sun',            l:'ดวงวันนี้', center:true },
          { id:'fortune',  fa:'fa-solid fa-wand-magic-sparkles', l:'ทำนาย' },
          { id:'profile',  fa:'fa-solid fa-user',           l:'โปรไฟล์' },
        ];
        const goTab = id => go(id === 'calendar' ? 'calendar' : id);
        return (
          <div style={{ position:'absolute', bottom:0, left:0, right:0, height:'83px', zIndex:20 }}>
            {/* Floating center button */}
            <div onClick={() => goTab('today')} style={{
              position:'absolute', top:'-20px', left:'50%', transform:'translateX(-50%)', zIndex:12,
              width:'56px', height:'56px', borderRadius:'50%',
              background:`linear-gradient(135deg, ${T.primary}, #F472B6)`,
              boxShadow:`0 4px 16px ${T.primary}40`,
              display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer',
            }}>
              <FaIcon fa="fa-solid fa-sun" size={22} color="#fff" />
            </div>
            {/* Bar background with curved notch */}
            <svg width="390" height="95" viewBox="0 0 390 95" style={{ position:'absolute', top:'-12px', left:0, zIndex:10 }}>
              <defs>
                <filter id="tabS" x="-5%" y="-20%" width="110%" height="140%">
                  <feDropShadow dx="0" dy="-2" stdDeviation="4" floodColor="#000" floodOpacity="0.06"/>
                </filter>
              </defs>
              <path d="M0 16 H152 C160 16 165 16 169 20 Q177 32 186 36 Q191 38 195 38 Q199 38 204 36 Q213 32 221 20 C225 16 230 16 238 16 H390 V95 H0 Z" fill="white" filter="url(#tabS)"/>
            </svg>
            {/* Tab items */}
            <div style={{ position:'relative', zIndex:11, display:'flex', height:'63px', paddingBottom:'20px', paddingTop:'8px' }}>
              {tabs.map(t => {
                if (t.center) return <div key={t.id} style={{ flex:1.2 }} />;
                const isA = active === t.id;
                return (
                  <div key={t.id} onClick={() => goTab(t.id)} style={{
                    flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'3px', cursor:'pointer',
                  }}>
                    <FaIcon fa={t.fa} size={19} color={isA ? T.primary : T.fgLow} />
                    <span style={{ fontFamily:T.font, fontSize:'10px', fontWeight:isA?700:400, color:isA?T.primary:T.fgLow }}>{t.l}</span>
                  </div>
                );
              })}
            </div>
            {/* Center label */}
            <div style={{ position:'absolute', bottom:'22px', left:'50%', transform:'translateX(-50%)', zIndex:11 }}>
              <span style={{ fontFamily:T.font, fontSize:'10px', fontWeight:active==='today'?700:400, color:active==='today'?T.primary:T.fgLow }}>ดวงวันนี้</span>
            </div>
          </div>
        );
      };

      const Skel = ({ w='100%', h='16px', r='8px', style:s }) => (
        <div style={{ width:w, height:h, borderRadius:r, background:`linear-gradient(90deg, ${T.bgMid} 25%, ${T.bgLight} 50%, ${T.bgMid} 75%)`, backgroundSize:'800px 100%', animation:'shimmer 1.5s ease-in-out infinite', ...s }} />
      );

      const SecHead = ({ title, sub, action, onAction }) => (
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:'12px' }}>
          <div>
            <div style={{ fontFamily:T.font, fontSize:'18px', fontWeight:700, color:T.fgHigh }}>{title}</div>
            {sub && <div style={{ fontFamily:T.font, fontSize:'13px', color:T.fgMid, marginTop:'2px' }}>{sub}</div>}
          </div>
          {action && <div onClick={onAction} style={{ fontFamily:T.font, fontSize:'13px', color:T.secondary, fontWeight:600, cursor:'pointer' }}>{action}</div>}
        </div>
      );

      const BackHeader = ({ title, right, onRight, onBack }) => (
        <div style={{ padding:'12px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:`1px solid ${T.border}` }}>
          <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
            <div onClick={onBack || (() => go('today'))} style={{ cursor:'pointer', fontSize:'20px', lineHeight:1 }}>←</div>
            <div style={{ fontFamily:T.font, fontSize:'16px', fontWeight:700, color:T.fgHigh }}>{title}</div>
          </div>
          {right && <div onClick={onRight} style={{ fontFamily:T.font, fontSize:'13px', color:T.secondary, fontWeight:600, cursor:'pointer' }}>{right}</div>}
        </div>
      );

      /* ═══════ SECTION 1: DAILY SUMMARY ═══════ */
      const DailySummary = () => (
        <div style={{ animation:'fadeIn 0.4s ease-out' }}>
          <SecHead title="สรุปในวันนี้" sub={`${mock.dayName}ที่ ${mock.date}`} />
          <div style={{ background:`linear-gradient(135deg, ${sBg(mock.status)} 0%, ${T.bgWhite} 100%)`, borderRadius:T.rXl, padding:'20px', border:`1px solid ${T.border}`, boxShadow:'0 2px 8px rgba(0,0,0,0.04)' }}>
            {/* Status */}
            <div style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'14px' }}>
              <div style={{ width:'40px', height:'40px', borderRadius:T.rFull, background:sBg(mock.status), border:`2px solid ${sColor(mock.status)}`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'20px' }}>{mock.statusIcon}</div>
              <div>
                <div style={{ fontFamily:T.font, fontSize:'16px', fontWeight:700, color:sColor(mock.status) }}>{mock.statusLabel}</div>
                <div style={{ fontFamily:T.font, fontSize:'12px', color:T.fgMid }}>อัปเดตทุกวัน เที่ยงคืน</div>
              </div>
            </div>
            {/* AI Summary */}
            <div style={{ fontFamily:T.font, fontSize:'14px', lineHeight:'22px', color:T.fgHigh, marginBottom:'16px', padding:'12px', background:'rgba(255,255,255,0.7)', borderRadius:T.rMd }}>{mock.aiSummary}</div>
            {/* Lucky Colors — dual circles */}
            <div style={{ display:'flex', gap:'6px', marginBottom:'16px', overflowX:'auto' }}>
              {mock.luckyColors.map((c,i) => (
                <div key={i} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:'5px', minWidth:'52px' }}>
                  <DualColor c1={c.c1} c2={c.c2} size={28} />
                  <div style={{ fontFamily:T.font, fontSize:'10px', color:T.fgLow }}>{c.aspect}</div>
                </div>
              ))}
            </div>
            {/* Do / Avoid */}
            <div style={{ display:'flex', gap:'8px', marginBottom:'14px' }}>
              <div style={{ flex:1, padding:'10px', background:T.successBg, borderRadius:T.rMd, border:`1px solid ${T.successLight}` }}>
                <div style={{ fontFamily:T.font, fontSize:'11px', fontWeight:700, color:T.success, marginBottom:'6px' }}>✅ ควรทำ</div>
                {mock.doList.map((d,i) => <div key={i} style={{ fontFamily:T.font, fontSize:'12px', lineHeight:'18px', color:T.fgHigh, marginBottom:'2px' }}>• {d}</div>)}
              </div>
              <div style={{ flex:1, padding:'10px', background:T.errorBg, borderRadius:T.rMd, border:`1px solid ${T.errorLight}` }}>
                <div style={{ fontFamily:T.font, fontSize:'11px', fontWeight:700, color:T.error, marginBottom:'6px' }}>❌ หลีกเลี่ยง</div>

            {/* Actions under each card */}
            <div style={{ display:'flex', gap:'8px', padding:'12px 20px 0', justifyContent:'center' }}>
              <div style={{ height:'36px', padding:'0 20px', borderRadius:T.rFull, background:T.primary, color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', gap:'6px', fontFamily:T.font, fontSize:'13px', fontWeight:700, cursor:'pointer', boxShadow:`0 3px 12px ${T.primary}30` }}>
                <FaIcon fa="fa-solid fa-share-nodes" size={12} color="#fff" /> แชร์
              </div>
              <div style={{ height:'36px', padding:'0 16px', borderRadius:T.rFull, border:`1.5px solid ${T.border}`, background:T.bgWhite, display:'flex', alignItems:'center', justifyContent:'center', gap:'5px', fontFamily:T.font, fontSize:'12px', color:T.fgMid, cursor:'pointer' }}>
                <FaIcon fa="fa-solid fa-download" size={11} color={T.fgMid} /> บันทึก
              </div>
              <div style={{ height:'36px', padding:'0 16px', borderRadius:T.rFull, border:`1.5px solid ${T.border}`, background:T.bgWhite, display:'flex', alignItems:'center', justifyContent:'center', gap:'5px', fontFamily:T.font, fontSize:'12px', color:T.fgMid, cursor:'pointer' }}>
                <FaIcon fa="fa-solid fa-copy" size={11} color={T.fgMid} /> คัดลอก
              </div>
            </div>
            {/* Theme name label */}
            <div style={{ textAlign:'center', marginTop:'6px' }}>
              <span style={{ fontFamily:T.font, fontSize:'11px', color:T.fgLow }}>{t.name}</span>
            </div>
          </div>
        );

        return (
          <div style={{ overflowY:'auto', height:'100%', paddingBottom:'100px', animation:'fadeIn 0.3s ease-out' }}>
            <BackHeader title="แชร์ดวงวันนี้" />

            {/* Hint */}
            <div style={{ padding:'10px 20px 16px', textAlign:'center' }}>
              <div style={{ fontFamily:T.font, fontSize:'13px', color:T.fgMid }}>เลื่อนดูธีมที่ชอบ แล้วกดแชร์ได้เลย</div>
              <div style={{ fontFamily:T.font, fontSize:'10px', color:T.fgLow, marginTop:'2px' }}>Share Card จะ generate เป็นรูป 9:16 (1080×1920)</div>
            </div>

            {/* Full-screen scrollable cards */}
            {tpls.map((t, i) => <ShareCard key={t.id} t={t} idx={i} />)}

            {/* Bottom spacer */}
            <div style={{ height:'20px' }} />
          </div>
        );
      };

      /* ═══════ RENDER ═══════ */
      const fortuneScreens = ['siamsi', 'tarot', 'dream', 'fortune'];
      const calScreens = ['calendar', 'fullcal', 'yearview', 'daydetail'];
      const mainTabScreens = ['today', 'calendar', 'notify', 'fortune', 'profile'];
      const activeTab = fortuneScreens.includes(screen) ? 'fortune'
        : calScreens.includes(screen) ? 'calendar'
        : screen === 'notify' ? 'notify'
        : screen === 'profile' ? 'profile'
        : 'today';
      const showTabBar = mainTabScreens.includes(screen);

      const renderScreen = () => {
        switch(screen) {
          case 'today': return <TodayPage />;
          case 'calendar': return <CalendarPage />;
          case 'notify': return <NotificationPage />;
          case 'fortune': return <FortunePage />;
          case 'profile': return <ProfilePage />;
          case 'sec1': return <div style={{ padding:'16px 20px', overflowY:'auto', height:'100%', paddingBottom:'100px' }}><DailySummary /></div>;
          case 'sec2': return <div style={{ padding:'16px 20px', overflowY:'auto', height:'100%', paddingBottom:'100px' }}><CalGrid compact={true} /></div>;
          case 'sec3': return <div style={{ padding:'16px 20px', overflowY:'auto', height:'100%', paddingBottom:'100px' }}><Shortcuts /></div>;
          case 'fullcal': return <FullCalPage />;
          case 'yearview': return <YearPage />;
          case 'daydetail': return <DayDetailPage />;
          case 'siamsi': return <SiamsiPage />;
          case 'tarot': return <TarotPage />;
          case 'dream': return <DreamPage />;
          case 'loading': return <LoadingPage />;
          case 'empty': return <EmptyPage />;
          case 'error': return <ErrorPage />;
          case 'share': return <SharePage />;
          default: return <TodayPage />;
        }
      };

      /* ═══════ DESIGN SPECS ═══════ */
      const specs = {
        today: { t:'Today Page (Full Scroll)', s:[
          { l:'STRUCTURE', i:['3 Sections scroll: Summary → Calendar → Shortcuts','Header: ทักทาย + Avatar','Padding: 20px | Section gap: 24px'] },
          { l:'TAB BAR', i:['Floating center button (56px, gradient pink)','Curved notch SVG path in bar bg','5 tabs: ปฏิทิน / แจ้งเตือน / ดวงวันนี้ / ทำนาย / โปรไฟล์','Active: primary color + bold label'] },
          { l:'BA NOTES', i:['AC-1.1: Load ภายใน 3 วินาที','NF-1: Cache ตาม วัน + user','Reset เที่ยงคืน timezone ผู้ใช้'] },
        ]},
        calendar: { t:'ปฏิทิน (3 Sub-tabs)', s:[
          { l:'SUB-TABS', i:['Pill segment control: รายวัน | รายเดือน | รายปี','Default: รายเดือน (Full Calendar)','รายวัน → Day Detail content (embedded)','รายปี → Year Overview content (embedded)'] },
          { l:'MONTH VIEW', i:['Month Nav (full-width, no box)','Filter Bar + chips (full-width)','Calendar Grid: taller cells 60px min-h','Monthly Summary + วันสำคัญ list'] },
          { l:'FILTER SYSTEM', i:['Toggle dropdown: 6 ประเภทวันสำคัญ','FontAwesome icons แทน emoji ทั้งหมด','Active chips แสดงด้านบน กด ✕ ปิดได้'] },
          { l:'NAVIGATION', i:['Tap day → switch to รายวัน sub-tab','ดูปีรวม → switch to รายปี sub-tab','BackHeader hidden in embedded mode'] },
        ]},
        notify: { t:'แจ้งเตือน', s:[
          { l:'LAYOUT', i:['Header: "แจ้งเตือน" + อ่านทั้งหมด CTA','Notification list (vertically scrollable)','Each item: Icon circle + title + desc + time','Unread: bold title + pink dot indicator'] },
          { l:'MOCK DATA', i:['6 notification items mixed read/unread','Types: ดวง, วันพระ, ดวงจันทร์, โปรโมชั่น, สรุป, ฟีเจอร์ใหม่','Time format: relative (5 นาที, 2 ชม., เมื่อวาน)'] },
        ]},
        fortune: { t:'ทำนาย (Micro Service Hub)', s:[
          { l:'LAYOUT', i:['Header: "ทำนายดวง" + subtitle','2-column grid of service cards','Each card: icon + name + description + badge'] },
          { l:'SERVICES', i:['เซียมซี (fa-scroll, ยอดนิยม) → SiamsiPage','เปิดไพ่ทาโร่ (fa-clone) → TarotPage','ทำนายฝัน (fa-cloud-moon, ใหม่) → DreamPage','ดูดวงเบอร์โทร (เร็วๆ นี้)','ดูลายมือ (เร็วๆ นี้)','ดูดวงคู่ (เร็วๆ นี้)'] },
          { l:'INTERACTION', i:['Active services → navigate to engine page','Coming soon → disabled (opacity 0.65)','Badge colors: ยอดนิยม=pink, ใหม่=violet, เร็วๆ นี้=gray'] },
        ]},
        profile: { t:'โปรไฟล์', s:[
          { l:'LAYOUT', i:['Gradient header: avatar + name + email','Premium badge (fa-crown, pill)','Stats row: วันที่ใช้งาน / ดวงที่ดู / แชร์','Menu list with FA icons + chevron'] },
          { l:'MENU ITEMS', i:['แก้ไขโปรไฟล์ (fa-pen-to-square)','การแจ้งเตือน (fa-bell)','ธีม (fa-palette)','เกี่ยวกับ (fa-circle-info)','ออกจากระบบ (fa-right-from-bracket, red)'] },
          { l:'NOTES', i:['Static mock — no interactivity','Avatar: gradient circle with "มู" text','Stats are decorative mock numbers'] },
        ]},
        sec1: { t:'Sec 1: Daily Summary Card', s:[
          { l:'COMPONENTS', i:['Status Badge (icon + color + label)','AI Summary (max 3 lines, 150 chars)','Lucky Color Chips (3 aspects)','Do/Avoid Lists (min 1 each)','Share + Read More buttons'] },
          { l:'DATA', i:['daily_status: enum (good/neutral/caution)','ai_summary_short: max 150 chars','lucky_colors: [{aspect, color_name, hex}]','do_list: string[] | avoid_list: string[]'] },
          { l:'AC MUST', i:['AC-1.2: 4 องค์ประกอบครบ','AC-1.3: AI max 3 บรรทัด','AC-1.4: สีมงคลเป็น color chip','AC-1.6: ปุ่มแชร์ → native share sheet'] },
        ]},
        sec2: { t:'Sec 2: Calendar', s:[
          { l:'COMPONENTS', i:['Month Header (< เดือน ปี >)','Day Grid (7 columns × 5-6 rows)','Color Dots per day','Today Highlight Ring','Legend Row'] },
          { l:'COLORS', i:['ดวงดี: #559652 (success)','ปกติ: #F8C135 (warning)','ระวัง: #EA244F (error)','Today Ring: #EC599D (primary)'] },
          { l:'AC MUST', i:['AC-2.1-2.4: สถานะสี + Legend + Highlight + เลื่อนเดือน','ข้อจำกัด: +-12 เดือน'] },
        ]},
        sec3: { t:'Sec 3: Fortune Shortcuts', s:[
          { l:'3 CARDS', i:['เซียมซีวันนี้ (badge: ยอดนิยม)','เปิดไพ่ทำนาย','ทำนายฝัน (badge: ใหม่)'] },
          { l:'AC MUST', i:['AC-3.1-3.5: ครบ 3 cards, redirect ไม่โหลดผล','NF-1: Static content / ไม่ call API','NF-3: Horizontal scroll smooth'] },
        ]},
        daydetail: { t:'Day Detail Page', s:[
          { l:'8 SECTIONS', i:['A: Header (วันที่ + สถานะ + วันพิเศษ)','B: ดาวเกิด & ดาวจร','C: AI Summary เฉพาะวัน','D: คำแนะนำ Do (3-5 ข้อ)','E: หลีกเลี่ยง Avoid (3-5 ข้อ)','F: สีมงคล + เลขมงคล','G: ช่วงเวลามงคล (Timeline)','H: AI Suggestion (actionable)'] },
          { l:'AC MUST', i:['AC-2.6: ดาวเกิด/จร + AI + Do/Avoid','AC-2.7: AI unique ทุกวัน','NF-3: โหลด < 2 วินาที'] },
        ]},
        fullcal: { t:'Full Calendar View', s:[
          { l:'LAYOUT', i:['Month Nav (full-width, no box)','Filter Bar + chips (full-width)','Calendar Grid: taller cells 60px min-h','Monthly Summary (boxed gradient card)','วันสำคัญเดือนนี้ (list, no outer box)'] },
          { l:'SPECIAL DAY TYPES', i:['วันพระ (fa-hands-praying, #FF9500)','วันพระจีน (fa-yin-yang, #E53935)','วันธงไชย (fa-star, #FFD700)','วันกาลกิณี (fa-skull, #78909C)','วันไหว้เจ้า (fa-place-of-worship, #AB47BC)','วันหยุด (fa-umbrella-beach, #EA244F)'] },
          { l:'AC MUST', i:['AC-2.8: ดูล่วงหน้าได้ 1 ปี','NF-2: Swipe smooth 60fps','Filter state persist ขณะเปลี่ยนเดือน'] },
        ]},
        yearview: { t:'Year Overview', s:[
          { l:'LAYOUT', i:['Grid 2×6 = 12 mini-calendars','Color dots แสดง pattern ทั้งปี','Tap เดือน → Month view','Highlight เดือนปัจจุบัน (pink border)'] },
        ]},
        siamsi: { t:'เซียมซี Engine', s:[
          { l:'FLOW', i:['Idle: กระบอกเซียมซี + ปุ่มเขย่า','Shaking: Animation เขย่า (0.5s loop)','Result: เลข + คำทำนาย + AI + level','Actions: เขย่าใหม่ / แชร์'] },
        ]},
        tarot: { t:'เปิดไพ่ Engine', s:[
          { l:'FLOW', i:['Select: ไพ่คว่ำ 6 ใบ เลือก 3','Flip: Animation พลิกไพ่','Result: ชื่อ/ภาพ + ความหมาย + AI','Actions: เปิดใหม่ / แชร์'] },
        ]},
        dream: { t:'ทำนายฝัน Engine', s:[
          { l:'FLOW', i:['Input: text + suggestion chips 6 คำ','Loading: ดวงดาวหมุน animation','Result: ความหมาย + AI interpretation','Actions: ทำนายใหม่ / แชร์'] },
        ]},
        loading: { t:'Loading State', s:[{ l:'PATTERN', i:['Skeleton shimmer animation','Match layout ของ filled state','NF-2 (DAIL-54): ใช้ skeleton/shimmer'] }] },
        empty: { t:'Empty State', s:[{ l:'PATTERN', i:['Illustration + ข้อความชี้แจง','CTA "ผูกดวงของคุณ" → หน้าตั้งค่า','AC-1.7: Required สำหรับ users ไม่มีข้อมูล'] }] },
        error: { t:'Error State', s:[{ l:'PATTERN', i:['"กำลังคำนวณดวงให้คุณ กรุณารอสักครู่"','ปุ่ม Retry (ลองใหม่)','H9: บอกปัญหาชัด + วิธีแก้'] }] },
        share: { t:'Share Card (Full-scroll Feed)', s:[
          { l:'LAYOUT', i:['Full-screen vertical scroll of 4 theme cards','Each card: 310×550 (9:16 ratio, export 1080×1920)','Brand + date header → fortune content → info card → footer','Actions (แชร์ / บันทึก / คัดลอก) under each card'] },
          { l:'4 THEMES', i:['Cosmic Night: dark purple gradient','Soft Pastel: light blue-pink','Gold Classic: dark navy + gold accent','Fresh Bloom: white + primary gradient'] },
          { l:'UX PATTERN', i:['No theme selector — scroll to browse','Each card has its own share/save/copy buttons','Staggered slideUp animation per card','Hint text: "เลื่อนดูธีมที่ชอบ แล้วกดแชร์ได้เลย"'] },
        ]},
      };

      const sp = specs[screen] || specs.today;

      /* ═══════ MAIN LAYOUT: 3 columns ═══════ */
      return (
        <div style={{ display:'flex', minHeight:'100vh', background:'#F0F1F3', fontFamily:T.font }}>
          {/* LEFT: Navigator */}
          <div style={{ width:'260px', background:T.bgWhite, borderRight:`1px solid ${T.border}`, padding:'20px 14px', overflowY:'auto', flexShrink:0 }}>
            <div style={{ fontSize:'20px', fontWeight:800, color:T.fgHigh, marginBottom:'2px' }}>DailyMu</div>
            <div style={{ fontSize:'11px', color:T.fgMid, marginBottom:'20px' }}>App Preview — Tab Navigation</div>
            {groups.map((g,gi) => (
              <div key={gi} style={{ marginBottom:'16px' }}>
                <div style={{ fontSize:'9px', fontWeight:700, color:T.fgLow, textTransform:'uppercase', letterSpacing:'1px', marginBottom:'6px' }}>{g.label}</div>
                {g.items.map(s => (
                  <div key={s.id} onClick={() => go(s.id)} style={{ padding:'7px 12px', borderRadius:T.rMd, marginBottom:'3px', background:screen===s.id?T.secondary:'transparent', color:screen===s.id?'#fff':T.fgHigh, fontWeight:screen===s.id?700:400, fontSize:'13px', cursor:'pointer', transition:'all 0.15s' }}>{s.name}</div>
                ))}
              </div>
            ))}
            {/* Jira Reference */}
            <div style={{ marginTop:'20px', padding:'12px', background:T.bgLight, borderRadius:T.rMd }}>
              <div style={{ fontSize:'10px', fontWeight:700, color:T.fgLow, textTransform:'uppercase', letterSpacing:'1px', marginBottom:'6px' }}>JIRA REFERENCE</div>
              <div style={{ fontSize:'11px', color:T.fgMid, lineHeight:'18px' }}>
                DAIL-33: Flow - Feature<br/>
                DAIL-54: Sec 1 Daily Summary<br/>
                DAIL-73: Sec 2 Calendar<br/>
                DAIL-74: Sec 3 Shortcuts
              </div>
            </div>
          </div>

          {/* CENTER: iPhone 15 Pro Frame */}
          <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', padding:'20px' }}>
            <div style={{ width:'390px', height:'844px', background:T.bgWhite, borderRadius:'48px', boxShadow:'0 20px 60px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05)', overflow:'hidden', display:'flex', flexDirection:'column', position:'relative' }}>
              <DynamicIsland />
              <StatusBar />
              <div style={{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column' }}>
                {renderScreen()}
              </div>
              {showTabBar && <TabBar active={activeTab} />}
            </div>
          </div>

          {/* RIGHT: Design Specs */}
          <div style={{ width:'300px', background:T.bgWhite, borderLeft:`1px solid ${T.border}`, flexShrink:0, overflowY:'auto' }}>
            <div style={{ padding:'20px' }}>
              <div style={{ fontFamily:T.font, fontSize:'13px', fontWeight:700, color:T.secondary, marginBottom:'4px' }}>📋 Design Spec</div>
              <div style={{ fontFamily:T.font, fontSize:'16px', fontWeight:800, color:T.fgHigh, marginBottom:'16px' }}>{sp.t}</div>
              {sp.s.map((sec,i) => (
                <div key={i} style={{ marginBottom:'16px' }}>
                  <div style={{ fontFamily:T.font, fontSize:'10px', fontWeight:700, color:T.fgLow, textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:'8px' }}>{sec.l}</div>
                  {sec.i.map((item,j) => (
                    <div key={j} style={{ fontFamily:T.font, fontSize:'12px', lineHeight:'18px', color:T.fgHigh, padding:'6px 10px', marginBottom:'4px', background:T.bgLight, borderRadius:T.rSm, borderLeft:`3px solid ${item.startsWith('AC')||item.startsWith('NF')?T.primary:T.border}` }}>{item}</div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
