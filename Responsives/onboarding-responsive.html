<!DOCTYPE html>
<html lang="th">

  <link href="https://fonts.cdnfonts.com/css/line-seed-sans-th" rel="stylesheet">
  <style>
    /* ===== 1. DESIGN TOKENS ===== */
    :root{--primary:#EC599D;--primary-light:#FDEFF5;--secondary:#7279FB;--secondary-light:#F1F2FF;--text-primary:#1B1D22;--text-secondary:#6A6E83;--text-tertiary:#9A9DAD;--bg-white:#FFFFFF;--bg-light:#F8F8F9;--bg-mid:#EBECEF;--border:#EBECEF;--error:#EA244F;--success-clr:#10B981;--info-clr:#68CAEC;--disabled-text:#9A9DAD;--disabled-bg:#EBECEF;--font:'LINE Seed Sans TH',sans-serif;--font-sys:'Inter',-apple-system,sans-serif;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;--r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-2xl:24px;--r-full:9999px;--sh-sm:0 1px 3px rgba(0,0,0,.1);--sh-md:0 4px 6px rgba(0,0,0,.1)}

    /* ===== 2. RESET ===== */
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font);background:#F0F1F3;-webkit-font-smoothing:antialiased}
    button{cursor:pointer;outline:none}img{display:block;max-width:100%}

    /* ===== 3. PREVIEW SHELL ===== */
    .shell{padding:var(--sp-8)}
    .page-title{font-size:13px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:1px;margin-bottom:var(--sp-8)}
    .section{margin-bottom:var(--sp-12)}.section:last-child{margin-bottom:0}
    .section-label{font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:var(--sp-4)}
    .row{display:flex;align-items:flex-start;gap:var(--sp-6);flex-wrap:wrap}
    .col{display:flex;flex-direction:column}
    .col-label{font-size:12px;font-weight:700;color:var(--text-tertiary);margin-bottom:var(--sp-2)}

    /* ===== 4. FRAME & SHARED ===== */
    .frame{overflow:hidden;position:relative;background:var(--bg-white)}
    .status-time{font-family:var(--font-sys);font-weight:600;color:#000;font-size:17px;line-height:22px}
    .status-icons{display:flex;align-items:center;gap:5px}.status-icons svg{display:block}
    .home-bar{border-radius:100px;background:#ADB7C6}

    /* ============================================
       ★ SPLASH
       ============================================ */

    .splash-body{flex:1;display:flex;align-items:center;justify-content:center;z-index:2;position:relative}
    .splash-logo{display:flex;align-items:center}
    .splash-logo img{object-fit:contain}
    .splash-home{flex-shrink:0;display:flex;justify-content:center;z-index:5}
    /* Splash — Mobile */
    .f-mobile .splash-status{padding:14px 24px 12px}.f-mobile .splash-logo{gap:4px}.f-mobile .splash-logo img:first-child{height:39px;width:45px}.f-mobile .splash-logo img:last-child{height:34px;width:192px}.f-mobile .splash-home{padding:var(--sp-1) 0 var(--sp-2)}.f-mobile .splash .home-bar{width:134px;height:5px}
    /* Splash — Tablet */
    .f-tablet .splash-status{padding:16px 32px 14px}.f-tablet .splash-logo{gap:6px}.f-tablet .splash-logo img:first-child{height:52px;width:60px}.f-tablet .splash-logo img:last-child{height:46px;width:260px}.f-tablet .splash-home{padding:6px 0 10px}.f-tablet .splash .home-bar{width:160px;height:5px}
    /* Splash — Landscape */
    .f-land .splash-status{padding:14px 40px 10px}.f-land .splash-logo{gap:5px}.f-land .splash-logo img:first-child{height:46px;width:53px}.f-land .splash-logo img:last-child{height:40px;width:226px}.f-land .splash-home{padding:var(--sp-1) 0 var(--sp-2)}.f-land .splash .home-bar{width:180px;height:5px}

    /* ============================================
       ★ ONBOARDING
       ============================================ */
    .ob{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFF 55%,#fde7f3 100%);overflow:hidden}
    .ob-status{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
    .ob-header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
    .ob-back{border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-white);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .ob-logo{object-fit:contain}.ob-skip{color:var(--text-secondary);font-weight:400;flex-shrink:0}
    .ob-illust{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;z-index:2;overflow:hidden}
    .ob-deco-tl{position:absolute;top:0;left:-6%;opacity:.25;pointer-events:none;z-index:1}
    .ob-deco-br{position:absolute;bottom:5%;right:-10%;opacity:.15;pointer-events:none;z-index:1;transform:rotate(15deg)}
    .ob-deco-ct{position:absolute;top:20%;right:-5%;opacity:.15;pointer-events:none;z-index:1;transform:rotate(-90deg)}

    .ob-btn-link{font-weight:700;color:var(--secondary);background:none;border:none;font-family:var(--font)}
    .ob-home{flex-shrink:0;display:flex;justify-content:center;z-index:5}
    /* Onboarding — Mobile */
    .f-mobile .ob-status{padding:14px 24px 10px}.f-mobile .ob-header{padding:var(--sp-1) var(--sp-4)}.f-mobile .ob-back{width:38px;height:38px}.f-mobile .ob-back svg{width:10px;height:16px}.f-mobile .ob-logo{height:26px}.f-mobile .ob-skip{font-size:16px}.f-mobile .ob-deco-tl{width:76%}.f-mobile .ob-deco-br{width:65%}.f-mobile .ob-deco-ct{width:60%}.f-mobile .ob-char{max-width:70%;max-height:80%}.f-mobile .ob-content{padding:var(--sp-5) var(--sp-5) 0}.f-mobile .ob-title{font-size:20px;line-height:28px;margin-bottom:var(--sp-4)}.f-mobile .ob-desc{font-size:16px;line-height:24px}.f-mobile .ob-pagi{gap:6px;padding:var(--sp-5) 0 0}.f-mobile .ob-dot{width:10px;height:10px}.f-mobile .ob-dot.on{width:28px}.f-mobile .ob-btns{padding:var(--sp-6) var(--sp-5);gap:var(--sp-4)}.f-mobile .ob-btn-main{max-width:350px;height:48px;font-size:16px}.f-mobile .ob-btn-link{font-size:16px}.f-mobile .ob-home{padding:var(--sp-1) 0 var(--sp-2)}.f-mobile .ob .home-bar{width:134px;height:5px}
    /* Onboarding — Tablet */
    .f-tablet .ob-status{padding:16px 32px 12px}.f-tablet .ob-header{padding:var(--sp-2) var(--sp-8)}.f-tablet .ob-back{width:44px;height:44px}.f-tablet .ob-back svg{width:12px;height:18px}.f-tablet .ob-logo{height:30px}.f-tablet .ob-skip{font-size:17px}.f-tablet .ob-deco-tl{width:50%}.f-tablet .ob-deco-br{width:40%}.f-tablet .ob-deco-ct{width:35%}.f-tablet .ob-char{max-width:45%;max-height:75%}.f-tablet .ob-content{padding:28px 60px 0}.f-tablet .ob-title{font-size:28px;line-height:36px;margin-bottom:var(--sp-5)}.f-tablet .ob-desc{font-size:18px;line-height:28px;max-width:540px}.f-tablet .ob-pagi{gap:var(--sp-2);padding:var(--sp-6) 0 0}.f-tablet .ob-dot{width:12px;height:12px}.f-tablet .ob-dot.on{width:36px}.f-tablet .ob-btns{padding:28px 60px;gap:var(--sp-5)}.f-tablet .ob-btn-main{max-width:420px;height:56px;font-size:18px;border-radius:var(--r-lg)}.f-tablet .ob-btn-link{font-size:18px}.f-tablet .ob-home{padding:6px 0 10px}.f-tablet .ob .home-bar{width:160px;height:5px}
    /* Onboarding — Landscape */
    .f-land .ob-status{padding:14px 40px 10px}.f-land .ob-header{padding:var(--sp-2) var(--sp-10)}.f-land .ob-back{width:44px;height:44px}.f-land .ob-back svg{width:12px;height:18px}.f-land .ob-logo{height:34px}.f-land .ob-skip{font-size:18px}.f-land .ob-deco-tl{width:35%}.f-land .ob-deco-br{width:28%}.f-land .ob-deco-ct{width:25%}.f-land .ob-char{max-width:40%;max-height:65%}.f-land .ob-content{padding:var(--sp-5) 100px 0}.f-land .ob-title{font-size:28px;line-height:36px;margin-bottom:var(--sp-5)}.f-land .ob-desc{font-size:18px;line-height:28px;max-width:600px}.f-land .ob-pagi{gap:var(--sp-2);padding:var(--sp-5) 0 0}.f-land .ob-dot{width:12px;height:12px}.f-land .ob-dot.on{width:36px}.f-land .ob-btns{padding:var(--sp-5) 100px;gap:var(--sp-4)}.f-land .ob-btn-main{max-width:480px;height:52px;font-size:17px;border-radius:var(--r-lg)}.f-land .ob-btn-link{font-size:17px}.f-land .ob-home{padding:var(--sp-1) 0 var(--sp-2)}.f-land .ob .home-bar{width:180px;height:5px}

    /* ============================================
       ★ AUTH
       ============================================ */
    .auth{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-white);overflow:hidden;isolation:isolate}
    .auth-char{position:absolute;z-index:4;left:50%;transform:translateX(-50%);pointer-events:none;overflow:hidden}.auth-char img{width:119.6%;height:111%;position:relative;left:-12.4%;top:-8.5%;max-width:none}
    .auth .home-ind{position:absolute;z-index:3;left:50%;transform:translateX(-50%);border-radius:100px;background:#1F2937;opacity:.15}
    .auth-status{display:flex;align-items:center;justify-content:space-between;background:#FEF4F5;flex-shrink:0;z-index:2}
    .auth-body{flex:1;min-height:0;z-index:1;background:linear-gradient(to bottom,#FDEFF5,#94728F);position:relative}
    .auth-back{position:absolute;z-index:2;background:var(--bg-white);border:1px solid var(--border);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center}
    .auth-card{position:absolute;bottom:0;left:0;right:0;background:var(--bg-white);border-radius:var(--r-2xl) var(--r-2xl) 0 0;display:flex;flex-direction:column;overflow:hidden;z-index:1}
    .title-group{display:flex;flex-direction:column}.auth-title{font-weight:700;color:var(--text-primary)}.auth-subtitle{font-weight:400;color:#6B7280}
    .auth-form{display:flex;flex-direction:column;width:100%}.field{display:flex;flex-direction:column}.field-label{font-weight:700;color:var(--text-primary)}
    .field-input{background:var(--bg-white);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text-tertiary);font-family:var(--font);display:flex;align-items:center}
    .pw-container{display:flex;flex-direction:column}.auth-forgot{font-weight:700;color:var(--secondary);text-align:right}
    .auth-cta{width:100%;border:none;border-radius:var(--r-md);background:var(--secondary);color:#fff;font-family:var(--font);font-weight:700}
    .auth-divider{display:flex;align-items:center;width:100%}.auth-divider .line{flex:1;height:1px;background:#E5E7EB}.auth-divider .text{color:var(--text-primary);font-weight:400;white-space:nowrap}
    .auth-social{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center}
    .social-btn{border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-white);flex-shrink:0}.social-btn img{object-fit:contain}
    .auth-link{text-align:center;flex-shrink:0}.auth-link .muted{color:var(--text-tertiary);font-weight:400}.auth-link .action{color:var(--secondary);font-weight:700}
    /* Auth — Mobile */
    .f-mobile .auth-char{top:48px;width:292px;height:211px}.f-mobile .auth .home-ind{bottom:8.6px;width:134px;height:5px}.f-mobile .auth-status{padding:14px 24px 12px}.f-mobile .auth-back{left:16px;top:16px;width:38px;height:38px}.f-mobile .auth-back svg{width:10px;height:16px}.f-mobile .auth-card{height:626px;padding:40px 16px;gap:24px}.f-mobile .title-group{gap:8px}.f-mobile .auth-title{font-size:24px;line-height:32px}.f-mobile .auth-subtitle{font-size:15px;line-height:22.5px}.f-mobile .auth-form{gap:20px}.f-mobile .field{gap:8px}.f-mobile .field-label{font-size:14px;line-height:20px}.f-mobile .field-input{height:40px;padding:0 12px;font-size:14px;line-height:22px}.f-mobile .pw-container{gap:12px}.f-mobile .auth-forgot{font-size:14px;line-height:22px}.f-mobile .auth-cta{height:40px;font-size:16px;line-height:24px}.f-mobile .auth-divider{gap:16px}.f-mobile .auth-divider .text{font-size:14px;line-height:22px}.f-mobile .auth-social{gap:24px}.f-mobile .social-btn{width:56px;height:56px}.f-mobile .social-btn img{width:24px;height:24px}.f-mobile .auth-link{font-size:14px;line-height:22px}
    /* Auth — Tablet */
    .f-tablet .auth-char{top:52px;width:380px;height:275px}.f-tablet .auth .home-ind{bottom:10px;width:160px;height:5px}.f-tablet .auth-status{padding:16px 32px 14px}.f-tablet .auth-back{left:32px;top:24px;width:44px;height:44px}.f-tablet .auth-back svg{width:12px;height:18px}.f-tablet .auth-card{height:740px;padding:48px;gap:28px;align-items:center}.f-tablet .auth-card>*{max-width:500px;width:100%}.f-tablet .title-group{gap:10px}.f-tablet .auth-title{font-size:28px;line-height:36px}.f-tablet .auth-subtitle{font-size:17px;line-height:26px}.f-tablet .auth-form{gap:24px}.f-tablet .field{gap:8px}.f-tablet .field-label{font-size:16px;line-height:22px}.f-tablet .field-input{height:48px;padding:0 16px;font-size:16px;line-height:24px;border-radius:var(--r-lg)}.f-tablet .pw-container{gap:12px}.f-tablet .auth-forgot{font-size:16px;line-height:24px}.f-tablet .auth-cta{height:48px;font-size:18px;line-height:26px;border-radius:var(--r-lg)}.f-tablet .auth-divider{gap:16px}.f-tablet .auth-divider .text{font-size:16px;line-height:24px}.f-tablet .auth-social{gap:28px}.f-tablet .social-btn{width:64px;height:64px}.f-tablet .social-btn img{width:28px;height:28px}.f-tablet .auth-link{font-size:16px;line-height:24px}
    /* Auth — Landscape */
    .f-land .auth-char{top:40px;width:280px;height:202px}.f-land .auth .home-ind{bottom:8px;width:180px;height:5px}.f-land .auth-status{padding:14px 40px 10px}.f-land .auth-back{left:40px;top:16px;width:44px;height:44px}.f-land .auth-back svg{width:12px;height:18px}.f-land .auth-card{height:558px;padding:32px 40px;gap:20px;align-items:center}.f-land .auth-card>*{max-width:440px;width:100%}.f-land .title-group{gap:6px}.f-land .auth-title{font-size:24px;line-height:32px}.f-land .auth-subtitle{font-size:15px;line-height:22px}.f-land .auth-form{gap:16px}.f-land .field{gap:6px}.f-land .field-label{font-size:14px;line-height:20px}.f-land .field-input{height:40px;padding:0 12px;font-size:14px;line-height:22px}.f-land .pw-container{gap:10px}.f-land .auth-forgot{font-size:14px;line-height:22px}.f-land .auth-cta{height:44px;font-size:16px;line-height:24px;border-radius:var(--r-lg)}.f-land .auth-divider{gap:16px}.f-land .auth-divider .text{font-size:14px;line-height:22px}.f-land .auth-social{gap:24px}.f-land .social-btn{width:56px;height:56px}.f-land .social-btn img{width:24px;height:24px}.f-land .auth-link{font-size:14px;line-height:22px}

    /* ============================================
       ★ FORM (PWSETUP, ForgetPW, ResetPW)
       ============================================ */

    .frm-status{display:flex;align-items:center;justify-content:space-between;background:#FEF4F5;flex-shrink:0;z-index:3}

    .frm-eye{flex-shrink:0;display:flex;align-items:center}.frm-eye svg{display:block}
    .frm-cta{width:100%;border:none;border-radius:var(--r-md);background:var(--secondary);color:#fff;font-family:var(--font);font-weight:700;flex-shrink:0}
    .frm-link{font-weight:700;color:var(--secondary);text-align:center;flex-shrink:0}
    .frm-info{display:flex;border-radius:6px;overflow:hidden;flex-shrink:0}.frm-info-bar{width:6px;background:var(--info-clr);flex-shrink:0}.frm-info-body{flex:1;background:#E6F6FC;display:flex;align-items:center;border-radius:0 8px 8px 0}.frm-info-icon{flex-shrink:0;display:flex;align-items:center}.frm-info-text{font-weight:400;color:var(--text-primary)}

/* ===== RENDER — SPLASH ===== */
function renderSplash(s){return `<div class="splash"><img class="ob-deco-tl" src="${A.decoTL}" alt=""><img class="ob-deco-br" src="${A.decoBR}" alt=""><img class="ob-deco-ct" src="${A.decoCT}" alt=""><div class="ob-deco-ov"><img src="${A.decoOV}" alt=""></div><div class="splash-status"><span class="status-time">09:41</span><div class="status-icons">${SVG_STATUS}</div></div><div class="splash-body"><div class="splash-logo"><img src="${A.splashIcon}" alt="Mu"><img src="${A.splashText}" alt="Calendar"></div></div><div class="splash-home"><div class="home-bar"></div></div></div>`}

/* ===== RENDER — ONBOARDING ===== */
function renderDots(a){return [0,1,2].map(i=>`<div class="ob-dot${i===a?' on':''}"></div>`).join('')}
function renderOnboarding(s){return `<div class="ob"><img class="ob-deco-tl" src="${A.decoTL}" alt=""><img class="ob-deco-br" src="${A.decoBR}" alt=""><img class="ob-deco-ct" src="${A.decoCT}" alt=""><div class="ob-deco-ov"><img src="${A.decoOV}" alt=""></div><div class="ob-status"><span class="status-time">09:41</span><div class="status-icons">${SVG_STATUS}</div></div><div class="ob-header"><div class="ob-back">${SVG_BACK}</div><img class="ob-logo" src="${A.logo}" alt="Logo"><span class="ob-skip">ข้าม</span></div><div class="ob-illust"><img class="ob-illust-bg" src="${A.illustBG}" alt=""><img class="ob-char" src="${A.obChar}" alt="Character"></div><div class="ob-content"><div class="ob-title">${s.title}</div><div class="ob-desc">${s.desc}</div></div><div class="ob-pagi">${renderDots(s.dotIndex)}</div><div class="ob-btns"><button class="ob-btn-main">${s.btn}</button><button class="ob-btn-link">${s.link}</button></div><div class="ob-home"><div class="home-bar"></div></div></div>`}

/* ===== RENDER — AUTH ===== */
function renderAuth(s){const flds=s.fields.map(f=>{const inp=`<div class="field"><div class="field-label">${f.label}</div><div class="field-input">${f.placeholder}</div></div>`;return f.forgot?`<div class="pw-container">${inp}<div class="auth-forgot">ลืมรหัสผ่าน?</div></div>`:inp}).join('');return `<div class="auth"><div class="auth-char"><img src="${A.authChar}" alt=""></div><div class="home-ind"></div><div class="auth-status"><span class="status-time">09:41</span><div class="status-icons">${SVG_STATUS}</div></div><div class="auth-body"><div class="auth-back">${SVG_BACK}</div><div class="auth-card"><div class="title-group"><div class="auth-title">${s.title}</div><div class="auth-subtitle">${s.subtitle}</div></div><div class="auth-form">${flds}</div><button class="auth-cta">${s.cta}</button><div class="auth-divider"><div class="line"></div><span class="text">หรือดำเนินการต่อด้วย</span><div class="line"></div></div><div class="auth-social"><div class="social-btn"><img src="${A.google}" alt="Google"></div><div class="social-btn"><img src="${A.facebook}" alt="Facebook"></div><div class="social-btn"><img src="${A.apple}" alt="Apple"></div></div><div class="auth-link"><span class="muted">${s.linkMuted} </span><span class="action">${s.linkAction}</span></div></div></div></div>`}

/* ===== RENDER — FORM ===== */
function renderForm(s){const flds=s.fields.map(f=>{let c='frm-field-input',ct='';if(f.disabled){c+=' disabled';ct=f.value}else if(f.type==='password'){ct=`<span>${f.value}</span><span class="frm-eye">${SVG_EYE}</span>`}else{c+=' placeholder';ct=f.placeholder||f.value||''}return `<div class="frm-field"><div class="frm-field-label">${f.label}</div><div class="${c}">${ct}</div></div>`}).join('');return `<div class="frm"><div class="frm-status"><span class="status-time">09:41</span><div class="status-icons">${SVG_STATUS}</div></div><div class="frm-nav"><div class="frm-back">${SVG_BACK}</div></div><div class="frm-body"><div class="frm-title-grp"><div class="frm-title">${s.title}</div><div class="frm-subtitle">${s.subtitle}</div></div><div class="frm-fields">${flds}</div><button class="frm-cta">${s.cta}</button>${s.link?`<div class="frm-link">${s.link}</div>`:''}${s.info?`<div class="frm-info"><div class="frm-info-bar"></div><div class="frm-info-body"><span class="frm-info-icon">${SVG_INFO}</span><span class="frm-info-text">${s.info}</span></div></div>`:''}</div><div class="frm-home"><div class="home-bar"></div></div></div>`}

/* ===== RENDER — MESSAGE (Success/Error) ===== */
function renderMessage(s){const isErr=s.iconType==='err';const iconCls=isErr?'msg-icon err':'msg-icon ok';const iconSvg=isErr?SVG_X_CIRCLE:SVG_MAIL;return `<div class="frm"><div class="frm-status"><span class="status-time">09:41</span><div class="status-icons">${SVG_STATUS}</div></div><div class="frm-nav"><div class="frm-back">${SVG_BACK}</div></div><div class="frm-body"><div class="msg-center"><div class="${iconCls}">${iconSvg}</div><div class="msg-title">${s.title}</div><div class="msg-desc">${s.desc}</div>${s.email?`<div class="msg-email">${s.email}</div>`:''}${s.hint?`<div class="msg-hint">${s.hint}</div>`:''}<div class="msg-actions"><button class="frm-cta lg">${s.cta}</button>${s.link?`<div class="frm-link">${s.link}</div>`:''}</div></div></div><div class="frm-home"><div class="home-bar"></div></div></div>`}

/* ===== RENDER — CONSENT ===== */
function renderConsent(s){const items=s.items.map(it=>{const cb=it.checked?`<div class="consent-cb checked">${SVG_CHECK}</div>`:`<div class="consent-cb unchecked"></div>`;return `<div class="consent-item">${cb}<div class="consent-item-body"><div class="consent-item-text">${it.text}</div><div class="consent-item-link">อ่านเพิ่มเติม</div></div></div>`}).join('');return `<div class="consent"><div class="consent-sheet"><div class="consent-handle-wrap"><div class="consent-handle"></div></div><div class="consent-title">${s.title}</div>${items}<div class="consent-terms">${s.terms}</div><button class="consent-btn">${s.cta}</button></div></div>`}

/* ===== RENDER — STEPPER ===== */
function renderStepper(s){const stepsHtml=s.steps.map(st=>{const numCls=st.done?'stp-num done':'stp-num pending';const numInner=st.done?SVG_CHECK_SM:st.num;const ddCls='stp-dropdown'+(st.filled?' filled':'')+(st.disabled?' disabled':'');let extras='';if(st.checkbox){const cbCls=st.cbChecked?'consent-cb checked':'consent-cb unchecked';const cbInner=st.cbChecked?SVG_CHECK:'';extras+=`<div class="stp-cb-row"><div class="${cbCls}">${cbInner}</div><span class="stp-cb-text">${st.checkbox}</span></div>`}if(st.info){extras+=`<div class="stp-info-msg">${SVG_INFO_SM}<span>${st.info}</span></div>`}return `<div class="stp-step"><div class="stp-indicator"><div class="${numCls}">${numInner}</div><div class="stp-line"></div></div><div class="stp-step-body"><div class="stp-step-label">${st.label}</div><div class="${ddCls}"><span>${st.input}</span>${SVG_CHEVRON}</div>${extras}</div></div>`}).join('');return `<div class="frm"><div class="frm-status"><span class="status-time">09:41</span><div class="status-icons">${SVG_STATUS}</div></div><div class="frm-nav"><div style="visibility:hidden" class="frm-back">${SVG_BACK}</div></div><div class="stp-close">${SVG_CLOSE}</div><div class="frm-body"><div class="frm-title-grp"><div class="frm-title">${s.title}</div><div class="frm-subtitle">${s.subtitle}</div></div><div class="stp-steps">${stepsHtml}</div><button class="stp-cta">${s.cta}</button></div><div class="stp-home"><div class="home-bar"></div></div></div>`}

/* ===== RENDER — PICKER ===== */
function renderPicker(s){const tabs=s.tabs.map((t,i)=>`<div class="picker-tab${i===s.activeTab?' active':''}">${t}</div>`).join('');const items=s.items.map(it=>`<div class="picker-item">${it}</div>`).join('');return `<div class="picker"><div class="picker-sheet"><div class="picker-handle-wrap"><div class="picker-handle"></div></div><div class="picker-tabs">${tabs}</div><div class="picker-list">${items}</div></div></div>`}

/* ===== RENDER — LOADING ===== */
function renderLoading(s){return `<div class="ld"><div class="frm-status"><span class="status-time">09:41</span><div class="status-icons">${SVG_STATUS}</div></div><div class="frm-nav"><div class="frm-back">${SVG_BACK}</div></div><div class="ld-body"><img class="ld-illust" src="${A.loadingBook}" alt="Loading"><div class="ld-text"><div class="ld-title">${s.title}</div><div class="ld-sub">${s.subtitle}</div></div></div><div class="frm-home"><div class="home-bar"></div></div></div>`}

/* ===== RENDER — TOAST ===== */
function renderToast(s){return `<div class="toast-ov"><div class="toast-card"><div class="toast-avatar"><img src="${A.obChar}" alt="avatar"></div><div class="toast-body"><div class="toast-title">${s.toastTitle}</div><div class="toast-desc">${s.toastDesc}</div></div></div></div>`}

/* ===== BUILD ===== */
const REN={splash:renderSplash,onboarding:renderOnboarding,auth:renderAuth,form:renderForm,message:renderMessage,consent:renderConsent,stepper:renderStepper,picker:renderPicker,loading:renderLoading,toast:renderToast};
const root=document.getElementById('root');
root.innerHTML=SCREENS.map(s=>{const r=REN[s.type];const frames=BPS.map(bp=>`<div class="col"><div class="col-label">${bp.label}</div><div class="frame ${bp.cls}">${r(s)}</div></div>`).join('');return `<div class="section"><div class="section-label">${s.label}</div><div class="row">${frames}</div></div>`}).join('');
</script>
</body>
</html>
